[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snncuda"
version = "0.1.0"
description = "Python ctypes wrapper for an installed SNNCuda shared library"
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["."]
include = ["snncuda*"]
